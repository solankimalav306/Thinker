<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Screen Snipper</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      background: rgba(0,0,0,0.3);
      cursor: crosshair;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    #selection {
      position: absolute;
      border: 2px dashed white;
      background-color: rgba(255, 255, 255, 0.2);
      display: none;
    }
  </style>
</head>
<body>
  <div id="selection"></div>
  <script src="renderer/snipper.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thinker</title>

  <!-- Sets the theme and accent before first paint so there is no flash of the wrong colours. -->
  <script src="js/splash-init.js"></script>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <style>
    html, body {
      display: grid;
      place-items: center;
      background: transparent;
      user-select: none;
      -webkit-app-region: drag;
    }

    .splash-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 460px;
      height: 300px;
      padding: 36px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      background: var(--surface);
      box-shadow: var(--shadow-3);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 18px;
    }

    .logo-t {
      --t-size: 56px;
      color: var(--text);
      animation: float 2.4s var(--ease) infinite;
    }

    .brand h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand p {
      margin-top: 4px;
      color: var(--text-2);
      font-size: var(--text-md);
    }

    .progress-track {
      height: 6px;
      overflow: hidden;
      border-radius: var(--radius-full);
      background: var(--sunken);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: var(--radius-full);
      background: var(--primary);
      transition: width 0.4s var(--ease);
    }

    .status {
      margin-top: var(--space-3);
      color: var(--text-3);
      font-size: var(--text-sm);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-5px) rotate(2deg); }
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="brand">
      <div class="brand-t logo-t" role="img" aria-label="Thinker"></div>
      <div>
        <h1>Thinker</h1>
        <p>Read. Ask. Mark it up.</p>
      </div>
    </div>

    <div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <p class="status" id="statusText">Sharpening pencils...</p>
    </div>
  </div>

  <script src="js/splash.js"></script>
</body>
</html>

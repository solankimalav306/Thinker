<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thinker starting...</title>

  <!-- Load user theme and accent synchronously to prevent flash of wrong colors -->
  <script src="js/splash-init.js"></script>

  <link rel="stylesheet" href="vendor/fonts/fonts.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; 
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Manrope", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Outer card layout to create a floating desktop widget feel */
    .splash-card {
      width: 460px;
      height: 300px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Adobe Acrobat style decorative layout details */
    .splash-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--text-soft));
    }

    /* Ambient background soft glow effect */
    .ambient-glow {
      position: absolute;
      top: -50%; left: -30%;
      width: 300px; height: 300px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.08;
      filter: blur(60px);
      pointer-events: none;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 24px;
    }

    /* Clean mask-based logo to dynamically use theme's accent color */
    .brand-logo-container {
      width: 76px;
      height: 76px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      background-color: var(--accent);
      -webkit-mask-image: url('assets/logoWhite.png');
      -webkit-mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-image: url('assets/logoWhite.png');
      mask-size: contain;
      mask-repeat: no-repeat;
      mask-position: center;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: logo-gently-pulse 2s infinite alternate ease-in-out;
    }

    @keyframes logo-gently-pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); opacity: 0.9; }
    }

    .brand-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
      line-height: 1.1;
    }

    .tagline {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .loading-section {
      width: 100%;
      margin-bottom: 8px;
    }

    /* Adobe Acrobat style clean thin loading track */
    .progress-track {
      width: 100%;
      height: 3px;
      background-color: var(--line);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-fill {
      height: 100%;
      background-color: var(--accent);
      border-radius: 10px;
      width: 0%;
      transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .loading-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-soft);
    }

    .version-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-soft);
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="splash-card">
    <div class="ambient-glow"></div>
    
    <div class="brand-section">
      <div class="brand-logo-container">
        <div class="brand-logo"></div>
      </div>
      <div class="brand-info">
        <h1>Thinker</h1>
        <p class="tagline">AI PDF Companion</p>
      </div>
    </div>

    <div class="loading-section">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="loading-meta">
        <p class="status" id="statusText">Starting core modules...</p>
        <span class="version-label">v1.0.0</span>
      </div>
    </div>
  </div>

  <script src="js/splash.js"></script>
</body>
</html>

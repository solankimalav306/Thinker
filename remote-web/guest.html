<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Shared from Thinker</title>
<link rel="stylesheet" href="guest.css">
</head>
<body>
<header class="bar">
  <strong class="brand">Thinker</strong>
  <span id="title" class="title"></span>
  <label id="who" class="who" hidden>Your name <input id="me" maxlength="24" autocomplete="off"></label>
  <span id="live" class="live" hidden>Live</span>
  <span id="role" class="note">View only</span>
</header>

<main>
  <form id="gate" class="gate" autocomplete="off" hidden>
    <h1>Enter the code</h1>
    <p>The person sharing this will read you a 6-digit code.</p>
    <input id="pin" name="pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" aria-label="6-digit code" required>
    <button type="submit">Open</button>
    <p id="gate-error" class="error" role="alert"></p>
  </form>

  <p id="message" class="message" hidden></p>
  <section id="view" class="view" hidden></section>
</main>

<footer class="foot">Shared over your local network. Anyone with the link and code can view this. Do not open links you were not given.</footer>
<script src="guest.js"></script>
</body>
</html>
